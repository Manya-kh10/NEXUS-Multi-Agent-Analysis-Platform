services:
  - type: web
    name: nexus-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery_app worker --loglevel=info --pool=solo > celery_startup.log 2>&1 & uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://nexus-multi-agent-analysis-platform.vercel.app,https://nexus-multi-agent-analysis-platform-5nddujzap.vercel.app
