version: '3.9'

services:
  postgres:
    image: postgres:15-bullseye
    platform: linux/amd64
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'

  backend:
    build: ./backend
    restart: always
    env_file: .env
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: always
    ports:
      - '8501:80'
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html

  celery_worker:
    build: ./backend
    restart: always
    env_file: .env
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data
      - ./backend:/app

  flower:
    build: ./backend
    restart: always
    env_file: .env
    command: celery -A app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    volumes:
      - ./backend:/app

volumes:
  pgdata: